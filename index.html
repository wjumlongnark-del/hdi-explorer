  const yc=[];h.forEach((s,i)=>{const m=s.match(/^(hdi|le|eys|mys|gnipc)_(\d{4})$/);if(m)yc.push([+m[2],i,m[1]==='gnipc'?'gni':m[1]])});
  const rc=h.map((s,i)=>[s.match(/^hdi_rank(?:_(\d{4}))?$/),i]).filter(x=>x[0]).sort((a,b)=>(+b[0][1]||0)-(+a[0][1]||0))[0];
  const M=new Map();
  R.slice(1).forEach(r=>{const iso=(r[iI]||'').trim();if(!iso)return;
    const g=/^ZZ/.test(iso);
    yc.forEach(([y,i,k])=>addEnt(M,r[iN],g?'':iso,y,num(r[i]),null,k));
    addEnt(M,r[iN],g?'':iso,null,null,rc?num(r[rc[1]]):null)});
  return [...M.values()];
}
function fromAPI(J){
  const arr=Array.isArray(J)?J:(J.data||J.results||J.items||[]);if(!arr.length)throw new Error('API: ไม่มีข้อมูล');
  const ks=Object.keys(arr[0]);const f=re=>ks.find(k=>re.test(k));
  const kI=f(/iso/i),kN=ks.find(k=>/country|name/i.test(k)&&!/iso|code/i.test(k)),kY=f(/^year/i),kV=f(/^value/i),kInd=f(/^indicator/i);
  const M=new Map();
  const which=x=>{x=String(x).toLowerCase();const c=(x.match(/^\s*([a-z]+)\b/)||[])[1];
    if(c&&{hdi:1,le:1,eys:1,mys:1,gnipc:1}[c])return c==='gnipc'?'gni':c;
    return /human development index/.test(x)?'hdi':/life expectancy/.test(x)?'le':/expected years/.test(x)?'eys':/mean years/.test(x)?'mys':/gross national income/.test(x)?'gni':null};
  arr.forEach(o=>{const ind=kInd?which(o[kInd]):'hdi';if(!ind)return;
    addEnt(M,o[kN]||o[kI],o[kI],+o[kY],num(o[kV]),null,ind)});
  return [...M.values()];
}
function toModel(ents,src){
  const cnt={};ents.forEach(e=>{if(e.c)Object.keys(e.y).forEach(y=>cnt[y]=(cnt[y]||0)+1)});
  const years=Object.keys(cnt).map(Number).filter(y=>cnt[y]>=50).sort((a,b)=>a-b);
  if(years.length<2)throw new Error('รูปแบบข้อมูลไม่ถูกต้อง หรือมีข้อมูลน้อยเกินไป');
  const LYv=years[years.length-1];
  let rows=ents.filter(e=>years.some(y=>e.y[y]!=null)||(e.c&&e.h)).map(e=>{const ind={};
    IND.forEach(k=>{const a=years.map(y=>e.m&&e.m[k]?e.m[k][y]??null:null);if(a.some(v=>v!=null))ind[k]=a});
    return {n:e.n,c:e.c,v:years.map(y=>e.y[y]??null),rk:e.rk||0,ind}});
  const C=rows.filter(r=>r.c&&r.v[years.length-1]!=null);
  if(!C.some(r=>r.rk)){const s=[...C].sort((a,b)=>b.v.at(-1)-a.v.at(-1));
    s.forEach((r,i)=>{r.rk=i&&s[i-1].v.at(-1).toFixed(3)===r.v.at(-1).toFixed(3)?s[i-1].rk:i+1})}
  rows.forEach(r=>{const lv=r.v.at(-1);r.t=tierOf(lv);if(!r.c||lv==null)r.rk=r.rk&&r.c?r.rk:0});
  rows.sort((a,b)=>(!!b.c-!!a.c)||((a.rk||999)-(b.rk||999))||a.n.localeCompare(b.n));
  return {years,rows,src:Object.assign({ts:Date.now(),latest:LYv},src)};
}
function parseAny(text,src){
  const s=text.trim();
  if(s[0]==='['||s[0]==='{')return toModel(fromAPI(JSON.parse(s)),src);
  const R=parseCSV(s);const h=R[0].map(x=>x.toLowerCase().trim());
  if(h.includes('iso3')&&h.some(x=>/^hdi_\d{4}$/.test(x)))return toModel(fromUNDP(R),src);
  if(h.includes('entity')&&h.includes('year'))return toModel([...fromOWID(R).values()],src);
  throw new Error('ไม่รู้จักรูปแบบไฟล์ (รองรับ CSV ของ UNDP HDR / Our World in Data / JSON จาก HDRO API)');
}
const embModel=()=>({years:HDI_DATA.years.slice(),rows:HDI_DATA.rows.map(([rk,n,c,t,v])=>({rk,n,c,t,v:v.slice(),ind:{}})),src:{id:'emb',ts:0,latest:HDI_DATA.years.at(-1)}});
async function fetchText(url,ms=30000){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);
  try{const r=await fetch(url,{signal:ac.signal,cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}
  finally{clearTimeout(tm)}
}
async function fetchOWID(){
  const M=fromOWID(parseCSV(await fetchText(OWID_URL)));
  const res=await Promise.allSettled(IND.map(k=>fetchText(OWID_COMP[k],45000).then(tx=>fromOWID(parseCSV(tx),M,k))));
  const m=toModel([...M.values()],{id:'owid',url:OWID_URL});
  m.src.compFail=IND.filter((k,i)=>res[i].status==='rejected');
  return m;
}
async function fetchSource(id){
  const errs=[];
  const tries=id==='owid'?[['owid',OWID_URL]]:id==='undp'?undpUrls().map(u=>['undp',u]):id==='api'?[['api',API_URL(prefs.key||'')]]:[['owid',OWID_URL],...undpUrls().map(u=>['undp',u])];
  if(id==='api'&&!prefs.key)throw new Error(T[lang].needKey);
  for(const [sid,url] of tries){
    try{if(sid==='owid')return await fetchOWID();
      const txt=await fetchText(url);return parseAny(txt,{id:sid,url:sid==='api'?'https://hdrdata.org':url})}
    catch(e){errs.push(`${sid}: ${e.name==='AbortError'?'timeout':e.message}`)}
  }
  throw new Error([...new Set(errs)].join(' | '));
}

let MODEL=embModel(),YRS=[],YI=[],L=0,FY=0,LY=0,D=[],WORLD=null,NC=0,HASC=false,COMPY=[],cyear=null;
const cap1=x=>Math.min(1,Math.max(0,x));
/* ดัชนีย่อยตามวิธีของ UNDP (HDR Technical Notes): สุขภาพ 20–85 ปี, การศึกษา MYS/15 + EYS/18, รายได้ ln(100)–ln(75,000) PPP$ 2021 */
function dimsOf(r,n){
  const g=k=>(r.ind&&r.ind[k])||Array(n).fill(null);const le=g('le'),eys=g('eys'),mys=g('mys'),gni=g('gni');
  const r3=x=>+x.toFixed(3);
  return {le,eys,mys,gni,
    hi:le.map(v=>v==null?null:r3(cap1((v-20)/65))),
    ei:eys.map((v,i)=>v==null||mys[i]==null?null:r3((cap1(mys[i]/15)+cap1(v/18))/2)),
    ii:gni.map(v=>v==null||v<=0?null:r3(cap1((Math.log(v)-Math.log(100))/(Math.log(75000)-Math.log(100)))))};
}
const compIdx=()=>{const i=MODEL.years.indexOf(cyear);return i>=0?i:MODEL.years.indexOf(COMPY[0]??MODEL.years.at(-1))};

const savePrefs=()=>store.set(PK,prefs);
function pickYears(all){
  const last=all.at(-1);
  if(prefs.ym==='all')return all.slice();
  if(prefs.ym==='five')return all.filter((y,i)=>i===0||y%5===0||y===last);
  const s=new Set([all[0],...all.filter(y=>[2000,2010,2015].includes(y)),...all.slice(-5)]);
  return all.filter(y=>s.has(y));
}
function applyModel(m){
  const key=d=>d.c||d.n,keep=sel.map(key);
  MODEL=m;YRS=pickYears(m.years);const idx=YI=YRS.map(y=>m.years.indexOf(y));
  L=YRS.length-1;FY=YRS[0];LY=YRS[L];
  D=m.rows.map(r=>({rk:r.rk,n:r.n,c:r.c,t:r.t,v:idx.map(i=>r.v[i]),all:r.v,cp:dimsOf(r,m.years.length)}));
  COMPY=m.years.filter((y,i)=>D.filter(d=>d.c&&d.cp.hi[i]!=null&&d.cp.ei[i]!=null&&d.cp.ii[i]!=null).length>=50).reverse();
  HASC=COMPY.length>0;if(!COMPY.includes(cyear))cyear=COMPY[0]??null;
  WORLD=D.find(d=>d.n==='World')||null;NC=D.filter(d=>d.c&&d.v.some(v=>v!=null)).length;
  sel=keep.map(k=>D.find(d=>key(d)===k)).filter(Boolean);
}
async function update(force,id=prefs.src){
  if(busy)return;busy=true;status={k:'load'};renderStatus();
  const prevLatest=MODEL.src.latest,prevEmb=MODEL.src.id==='emb';
  try{
    const m=await fetchSource(id);
    applyModel(m);store.set(CK,m);
    status={k:'ok',nw:!prevEmb&&m.src.latest>prevLatest?m.src.latest:0};
    applyLang();
  }catch(e){status={k:MODEL.src.id==='emb'?'emb':'cache',err:e.message};renderStatus()}
  finally{busy=false}
}
async function importFile(file){
  try{const txt=await file.text();const m=parseAny(txt,{id:'file',url:file.name});applyModel(m);store.set(CK,m);status={k:'ok'};applyLang()}
  catch(e){status={k:MODEL.src.id==='emb'?'emb':'cache',err:e.message};renderStatus()}
}

/* ---------- search ---------- */
let hl=0,matches=[];
function search(){
  const q=$('q').value.trim().toLowerCase();
  const sc=d=>{const a=[nm(d,'th').toLowerCase(),d.n.toLowerCase(),(d.c||'').toLowerCase()];
    if(!q)return 1; if(a.some(s=>s.startsWith(q)))return 0; if(a.some(s=>s.split(/[\s(),-]+/).some(w=>w.startsWith(q))))return 1; if(a.some(s=>s.includes(q)))return 2; return 9;};
  matches=D.map(d=>[sc(d),d]).filter(x=>x[0]<9||!q).sort((a,b)=>a[0]-b[0]||nm(a[1]).localeCompare(nm(b[1]),lang)).map(x=>x[1]);
  hl=0;drawDD();
}
function drawDD(){
  const dd=$('dd');dd.style.display='block';
  dd.innerHTML=matches.length?'':`<div>${t('nf')}</div>`;
  matches.forEach((d,i)=>{const e=document.createElement('div');
    e.className=(sel.includes(d)?'on ':'')+(i===hl?'hl':'');
    e.innerHTML=`<span>${sel.includes(d)?'✓ ':''}${esc(nm(d))}</span><small>${esc(lang==='th'?d.n:nm(d,'th'))}${d.c?'':' · '+t('grp')}</small>`;
    e.onmousedown=ev=>{ev.preventDefault();toggle(d)};dd.appendChild(e)});
}
function toggle(d){sel=sel.includes(d)?sel.filter(x=>x!==d):[...sel,d];refresh();drawDD()}
$('q').addEventListener('input',search);
$('q').addEventListener('focus',search);
$('q').addEventListener('blur',()=>$('dd').style.display='none');
$('q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){hl=Math.min(hl+1,matches.length-1);drawDD();$('dd').children[hl]?.scrollIntoView({block:'nearest'})}
  else if(e.key==='ArrowUp'){hl=Math.max(hl-1,0);drawDD();$('dd').children[hl]?.scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'&&matches[hl]){toggle(matches[hl])}
  else if(e.key==='Escape')$('dd').style.display='none';
});

/* ---------- table ---------- */
const CK7=[['le','f1'],['eys','f1'],['mys','f1'],['gni','int'],['hi','h3'],['ei','h3'],['ii','h3']];
const FM={rk:v=>v,txt:v=>v,h3:v=>v.toFixed(3),chg:v=>(v>0?'+':'')+v.toFixed(3),g2:v=>v.toFixed(2),f1:v=>v.toFixed(1),int:v=>Math.round(v).toLocaleString('en-US')};
const fmtK=k=>k==='gni'?FM.int:k[1]==='i'?FM.h3:FM.f1;
function rows(){
  const f3=v=>v==null?null:+v.toFixed(3);
  const R=[{l:t('rRank'),v:sel.map(d=>d.rk||null),f:'rk'},{l:t('rTier'),v:sel.map(d=>(TIER[d.t]||[null,null])[lang==='th'?0:1]),f:'txt'}];
  YRS.forEach((y,i)=>R.push({l:t('rHDI')+' '+y,v:sel.map(d=>d.v[i]),f:'h3',b:1}));
  R.push({l:t('rChg'),v:sel.map(d=>d.v[0]!=null&&d.v[L]!=null?f3(d.v[L]-d.v[0]):null),f:'chg',b:1});
  R.push({l:t('rGr'),v:sel.map(d=>{const g=gr(d.v[0],d.v[L],LY-FY);return g==null?null:+g.toFixed(2)}),f:'g2',b:1});
  if(HASC){const ci=compIdx();R.push({sec:t('secC')});
    CK7.forEach(([k,f])=>R.push({l:t('i_'+k),v:sel.map(d=>d.cp[k][ci]),f,b:1,dim:k[1]==='i'}));
    R.push({l:t('i_low'),v:sel.map(d=>{const x=[['hi',d.cp.hi[ci]],['ei',d.cp.ei[ci]],['ii',d.cp.ii[ci]]].filter(z=>z[1]!=null);if(x.length<3)return null;return t('d_'+x.sort((p,q)=>p[1]-q[1])[0][0])}),f:'txt'});}
  return R;
}
function renderTable(){
  const cl=$('cyl');cl.style.display=HASC&&sel.length?'':'none';
  if(HASC)$('cyr').innerHTML=COMPY.map(y=>`<option ${y===cyear?'selected':''}>${y}</option>`).join('');
  if(!sel.length){$('tbl').innerHTML=`<div class="empty">${t('none')}</div>`;$('cap').textContent='';$('bxl').disabled=true;return}
  $('bxl').disabled=false;
  const R=rows();
  let h='<table><thead><tr><th></th>'+sel.map(d=>`<th>${esc(nm(d))}</th>`).join('')+'</tr></thead><tbody>';
  R.forEach(r=>{
    if(r.sec){h+=`<tr class="sec"><td colspan="${sel.length+1}">${esc(r.sec)}</td></tr>`;return}
    const nums=r.v.filter(v=>typeof v==='number');
    const mx=r.b&&sel.length>1&&nums.length?Math.max(...nums):null;
    h+=`<tr${r.dim?' class="dim"':''}><td>${esc(r.l)}</td>`+r.v.map(v=>{
      const s=v==null?'–':(typeof v==='number'?FM[r.f](v):esc(v));
      return `<td class="${mx!=null&&v===mx?'best':''}">${s}</td>`}).join('')+'</tr>';
  });
  $('tbl').innerHTML=h+'</tbody></table>';
  $('cap').innerHTML=esc(t('cap'))+(HASC?'<br><br>'+esc(t('capC')):'<br><br>'+esc(t('noComp')));
}
$('cyr').onchange=e=>{cyear=+e.target.value;refresh()};
$('bxl').onclick=()=>{

const BG={id:'bg',beforeDraw(c){const x=c.ctx;x.save();x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.restore()}};
const VL={id:'vl',afterDatasetsDraw(ch){
  const o=ch.options.plugins.vl||{};if(!o.mode||o.mode==='off')return;
  const x=ch.ctx;x.save();x.font='600 11px Sarabun,sans-serif';x.fillStyle='#1c2333';x.textBaseline='bottom';x.textAlign='center';
  const hz=ch.options.indexAxis==='y';
  ch.data.datasets.forEach((ds,di)=>{
    const m=ch.getDatasetMeta(di);if(m.hidden||ds.nolabel)return;
    let last=-1;ds.data.forEach((v,i)=>{if(v!=null)last=i});
    m.data.forEach((el,i)=>{const v=ds.data[i];if(v==null)return;
      if(o.mode==='latest'&&i!==last)return;
      if(o.mode==='nth'&&i%Math.max(1,o.n)!==0)return;
      const txt=o.f?o.f(v,ds,i):(typeof v==='number'?(Math.abs(v)<1?v.toFixed(3):v.toFixed(2)):v);
      if(hz){x.textAlign='left';x.textBaseline='middle';x.fillText(txt,el.x+4,el.y)}
      else{x.textAlign='center';x.textBaseline='bottom';x.fillText(txt,el.x,el.y-5)}
    })});
  x.restore()}};
Chart.register(VL,BG);Chart.defaults.font.family='Sarabun,sans-serif';

function card(id,key,modes,defN,cfg,f,x){
  const s=LS[id]||(LS[id]={mode:'off',n:defN});
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,layout:{padding:{top:16,right:24}}},cfg.options||{});
  cfg.options.plugins=Object.assign({legend:{position:'bottom'},vl:{mode:s.mode,n:s.n,f}},cfg.options.plugins||{});
  const e=document.createElement('div');e.className='card ch';
  const lbl={off:t('off'),all:t('all'),latest:t('latest'),nth:t('nth')};
  e.innerHTML=`<h3>${t(key)[0]}</h3><p>${t(key)[1]}</p><div class="ctl">${x?`<select class="xs">${x.o.map(([v,l])=>`<option value="${v}" ${v===x.v?'selected':''}>${esc(l)}</option>`).join('')}</select>`:''}<button class="btn sec png">${t('png')}</button><span>${t('lab')}</span><select>${modes.map(m=>`<option value="${m}" ${m===s.mode?'selected':''}>${lbl[m]}</option>`).join('')}</select><input type="number" min="1" value="${s.n}" title="N"></div><div class="cv"><canvas></canvas></div>`;
  $('grid').appendChild(e);
  const ch=new Chart(e.querySelector('canvas'),cfg);charts.push(ch);
  const sl=e.querySelector('select:not(.xs)'),inp=e.querySelector('input');
  if(x)e.querySelector('.xs').onchange=ev=>x.on(ev.target.value);
  const up=()=>{s.mode=sl.value;s.n=+inp.value||1;inp.style.display=s.mode==='nth'?'':'none';ch.options.plugins.vl.mode=s.mode;ch.options.plugins.vl.n=s.n;ch.update()};
  sl.onchange=up;inp.oninput=up;inp.style.display=s.mode==='nth'?'':'none';
  e.querySelector('.png').onclick=()=>{const a=document.createElement('a');a.href=ch.toBase64Image('image/png',1);a.download=`HDI_${id}.png`;a.click()};
}
function renderCharts(){
  charts.forEach(c=>c.destroy());charts=[];$('grid').innerHTML='';

  const N=sel.map(nm),T_=['off','all','latest','nth'],B=['off','all','nth'];

  const yAx=(min)=>({scales:{y:{min}}});
  card('trend','c1',T_,2,{type:'line',data:{labels:YRS,datasets:ds(d=>d.v,{tension:.25,spanGaps:true,pointRadius:4,borderWidth:2.5,backgroundColor:undefined})}});
  card('byyear','c2',T_,2,{type:'bar',data:{labels:YRS,datasets:ds(d=>d.v)},options:{scales:{y:{min:0,max:1}}}});

  const ms=[...new Set([FY,...YRS.filter(y=>y%10===0),LY])].sort((a,b)=>a-b);

function chips(){
  $('chips').innerHTML='';
  sel.forEach(d=>{const e=document.createElement('span');e.className='chip';e.innerHTML=`${esc(nm(d))}<b title="✕">✕</b>`;e.querySelector('b').onclick=()=>toggle(d);$('chips').appendChild(e)});
}
function refresh(){chips();renderTable();renderCharts()}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('bch').textContent=t(show?'hideCh':'showCh');$('q').placeholder=t('ph');
  $('bth').classList.toggle('on',lang==='th');$('ben').classList.toggle('on',lang==='en');
  dataPanel();refresh();
}
$('bth').onclick=()=>{lang='th';applyLang()};$('ben').onclick=()=>{lang='en';applyLang()};
$('bch').onclick=()=>{show=!show;$('bch').textContent=t(show?'hideCh':'showCh');renderCharts();if(show&&sel.length)$('charts').scrollIntoView({behavior:'smooth'})};
$('brs').onclick=()=>{sel=[];show=false;LS={};$('q').value='';$('dd').style.display='none';applyLang()};

/* ---------- start: แสดงข้อมูลทันที (แคช/ฝังในไฟล์) แล้วดึงข้อมูลออนไลน์เบื้องหลัง ---------- */
(function init(){
  const c=store.get(CK);
  if(c&&c.years&&c.rows&&c.years.at(-1)>=HDI_DATA.years.at(-1)){applyModel(c);status={k:'cache'}}else applyModel(embModel());
  applyLang();
  const age=Date.now()-(MODEL.src.ts||0);
  if(MODEL.src.id==='emb'||age>MAX_AGE)update(false);
  setInterval(()=>{if(!document.hidden)update(false)},POLL);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-(MODEL.src.ts||0)>POLL)update(false)});
})();
</script>
</body>
